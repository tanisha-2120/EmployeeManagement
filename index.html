<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <div class="form-box">

            <h2>Add Employee</h2>

            <input type="text" id="employeeId" placeholder="Employee ID">

            <input type="text" id="employeeName" placeholder="Employee Name">

            <input type="email" id="employeeEmail" placeholder="Email">

            <input type="text" id="department" placeholder="Department">

            <input type="text" id="designation" placeholder="Designation">

            <input type="number" id="salary" placeholder="Salary">

            <button onclick="addEmployee()">Add Employee</button>

        </div>


        <div class="search-box">

            <h2>Search Employee</h2>

            <input type="text"
                   id="searchInput"
                   placeholder="Search by ID or Name"
                   onkeyup="searchEmployee()">

        </div>


        <div class="employee-box">

            <h2>Employee Details</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
